<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Notes Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs" type="module"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar glass-panel" id="sidebar">
      <div class="brand">
        <div class="brand-badge">▣</div>
        <h1>PDF_NODES</h1>
      </div>

      <nav class="nav-section" aria-label="Primary navigation">
        <button class="nav-item active" data-filter="all">all</button>
        <button class="nav-item" data-filter="recent">recent</button>
      </nav>

      <section class="group-section">
        <div class="section-heading">
          <h2>folders</h2>
          <button id="newFolderBtn" class="icon-btn" title="Add folder">+</button>
        </div>
        <div id="folderList" class="token-list"></div>
      </section>

      <section class="group-section">
        <h2>tags</h2>
        <div id="tagList" class="token-list"></div>
      </section>
    </aside>

    <main class="content">
      <header class="topbar glass-panel">
        <button id="mobileMenuBtn" class="icon-btn mobile-only" aria-label="Toggle sidebar">☰</button>
        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="> find" />
        </div>
        <div class="topbar-actions">
          <button id="viewToggle" class="segmented" aria-label="Toggle view">
            <span data-view="grid" class="active">grid</span>
            <span data-view="list">list</span>
          </button>
          <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode">◐</button>
        </div>
      </header>

      <section id="dropZone" class="drop-zone glass-panel">
        <p><strong>drop pdf</strong> · <button id="pickFilesBtn" class="link-btn">pick</button></p>
        <input id="fileInput" type="file" accept="application/pdf" multiple hidden />
      </section>

      <section id="notesContainer" class="notes-grid" aria-live="polite"></section>
    </main>
  </div>

  <button id="floatingUpload" class="floating-upload">+ upload</button>

  <dialog id="pdfViewerModal" class="viewer-modal">
    <article class="viewer-card">
      <header>
        <h3 id="viewerTitle"></h3>
        <button id="closeViewer" class="icon-btn" aria-label="Close viewer">✕</button>
      </header>
      <iframe id="pdfFrame" title="PDF Viewer"></iframe>
    </article>
  </dialog>

  <template id="noteCardTemplate">
    <article class="note-card glass-panel">
      <img class="thumbnail" alt="PDF first page preview" />
      <div class="note-meta">
        <h3 class="title"></h3>
        <p class="date"></p>
        <p class="folder"></p>
        <div class="tags"></div>
      </div>
      <div class="card-actions">
        <button class="open-btn">open</button>
        <button class="rename-btn">rename</button>
        <button class="delete-btn danger">drop</button>
      </div>
    </article>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
